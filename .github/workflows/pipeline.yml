name: Pipeline DevSecOps
on: push
jobs:
  mi-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Escaneo SAST con SonarQube
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" 
        with:
          args: >
            -Dsonar.organization=Barajas Flores Alejandra
            -Dsonar.projectKey=alebarajasflores

      - name: Construir imagen Docker
        run: docker build -t mi-app-java .

      - name: Escanear imagen con Trivy 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-java'
