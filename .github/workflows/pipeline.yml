name: Pipeline DevSecOps
on: push
jobs:
  mi-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Escaneo SAST con SonarQube
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" 
        with:
          args: >
            -Dsonar.organization=alebarajasflores
            -Dsonar.projectKey=aleBarajasFlores_devsecops_pipeline

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest .

      - name: Escanear imagen con Trivy 
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publicar imagen segura
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest
