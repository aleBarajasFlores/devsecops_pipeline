name: Pipeline DevSecOps
on: push
jobs:
  mi-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Escaneo SAST con SonarQube
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" 
        with:
          args: >
            -Dsonar.organization=alebarajasflores
            -Dsonar.projectKey=aleBarajasFlores_devsecops_pipeline

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest .

      - name: Escanear imagen con Trivy 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publicar imagen segura
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mi-app-java:latest
